services:
  api:
    image: ${API_IMAGE_NAME}:${API_IMAGE_TAG}
    pull_policy: never

  nginx:
    ports:
      - "${API_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - "./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro"
      - "/etc/letsencrypt:/etc/letsencrypt:ro"
      - "${FRONTEND_STATIC_ROOT_PATH_HOST}:${FRONTEND_STATIC_ROOT_PATH_CONTAINER}:ro"